name: Lint

on:
  pull_request:

jobs:
  lint:
    uses: FPtje/GLuaFixer/.github/workflows/glualint.yml@master
    with:
      config: "https://cfc.gg/configs/gluafixer/glualint.json"

  luals:
    uses: CFC-Servers/gmod_luals_workflow/.github/workflows/luals.yml@main

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # v2.2.0
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
        with:
          version: 1.7.12

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          version: v0.11.0

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: docker/Dockerfile
          ignore: DL3007,DL3008,DL3066
