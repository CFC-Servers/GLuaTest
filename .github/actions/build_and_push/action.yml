name: Build and Push (Single)
description: "Build and push GLuaTest for the given gmod branch"

inputs:
  gmod_branch:
    description: "The branch to build. Must be 'public'/'x86-64'/'dev'/'prerelease'"
    required: true
    default: "public"
  tag_name:
    description: "Tag name for the Docker image (or version tag)"
    required: true
  release:
    type: boolean
    description: "Is this a full release?"
    required: true
  github_token:
    description: "GitHub Token"
    required: true
  game_version:
    description: "The version ID for this build of gmod"
    required: true

runs:
  using: "composite"
  steps:
    - name: Get docker-slim
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/get_docker_slim.sh"

    - name: Build starter image
      shell: bash
      env:
        GMOD_BRANCH: ${{ inputs.gmod_branch }}
        TAG_NAME: ${{ inputs.tag_name }}
      run: bash "$GITHUB_ACTION_PATH/build_fat_image.sh"

    - name: Make slim image
      shell: bash
      env:
        GMOD_BRANCH: ${{ inputs.gmod_branch }}
        TAG_NAME: ${{ inputs.tag_name }}
        GAME_VERSION: ${{ inputs.game_version }}
        RELEASE: ${{ inputs.release }}
      run: bash "$GITHUB_ACTION_PATH/make_slim_image.sh"

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Tag and push slim image
      shell: bash
      env:
        GMOD_BRANCH: ${{ inputs.gmod_branch }}
      run: bash "$GITHUB_ACTION_PATH/push_image.sh"
